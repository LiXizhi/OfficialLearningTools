<!doctype html>
<html lang="zh-CN" class="role-entry" data-page="entry" data-site="和小布米一起学 NPL 代码编程 · 课程入口"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="小布米 NPL 代码编程课程：12 个示例、学生学习单与教师教案"><title>和小布米一起学 NPL 代码编程 · 课程入口</title><style>

:root{
  --ink:#1c2937;--muted:#5c6b7a;--faint:#8793a0;--line:#dce2e9;--bg:#f2f4f7;--card:#fff;
  --silver:#eaeef3;--silver2:#d3dae3;--steel:#566473;
  --teal:#13828a;--teal-bg:#e2f2f2;--purple:#5f55b0;--purple-bg:#eeecf9;
  --amber:#a8650a;--amber-bg:#fff2dc;--amber-line:#e9b25a;--green:#27784d;--green-bg:#e4f3ea;
  --blue:#1f5fc4;--blue-bg:#e5eefb;--red:#b23b3b;
  --accent:var(--teal);--accent-bg:var(--teal-bg);
  --side:276px;--top:56px;--r:14px;--fs:17px;
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
.role-teacher{--accent:#35588f;--accent-bg:#e7edf7;--fs:15.5px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.75 var(--font)}
a{color:var(--accent);text-underline-offset:3px}
img{max-width:100%}
h1,h2,h3,h4{line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
code{font:.92em/1.4 ui-monospace,Consolas,monospace;background:var(--silver);padding:.1em .4em;border-radius:5px}

/* ---------- 顶栏与侧栏 ---------- */
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:30;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none;font-size:16px;min-width:0}
.top .brand img{width:30px;height:30px;border-radius:50%;background:linear-gradient(#eef2f6,#cfd8e2);object-fit:cover;object-position:50% 20%}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-tag{flex:none;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:99px;padding:2px 10px}
.top .sp{flex:1}
.tbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:#fff;font-size:14px;text-decoration:none;color:var(--ink)}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tbtn.go:hover{filter:brightness(1.08);color:#fff}
#menu{display:none;width:38px;padding:0;justify-content:center;font-size:18px}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:14px 10px 40px;z-index:20}
.side a{display:flex;gap:9px;align-items:baseline;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.45}
.side a:hover{background:var(--silver)}
.side a.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
.side a .n{flex:none;font:700 12px/1 ui-monospace,Consolas,monospace;color:var(--faint);width:18px}
.side a.on .n{color:var(--accent)}
.side a .dot{flex:none;margin-left:auto;align-self:center;width:7px;height:7px;border-radius:50%;background:transparent}
.side a.has .dot{background:var(--accent)}
.side h6{margin:14px 10px 4px;font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.04em}
.side .tip{margin:18px 10px 0;font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px}
main{margin-left:var(--side);padding:calc(var(--top) + 26px) 28px 80px}
.view{max-width:900px;margin:0 auto}
.role-teacher .view{max-width:1010px}
.js .view{display:none}.js .view.on{display:block}
.js .pane{display:none}.js .pane.on{display:block}

/* ---------- 课头 ---------- */
.lhead{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:linear-gradient(135deg,#fff 0%,#eef1f5 60%,#dfe5ec 100%);
  border:1px solid var(--line);border-radius:20px;padding:22px 26px;position:relative;overflow:hidden}
.lhead .lnum{font:800 54px/1 "DIN Alternate","Bahnschrift",ui-sans-serif,sans-serif;color:var(--accent);letter-spacing:-.02em}
.lhead .lnum small{display:block;font:700 12px/1.6 var(--font);color:var(--muted);letter-spacing:.2em}
.lhead h1{font-size:clamp(22px,2.6vw,30px)}
.lhead .lmeta{margin:0 0 6px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border-radius:99px;padding:1px 10px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--steel);white-space:nowrap}
.chip.k{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.lhead .rb{height:128px;width:auto;margin:-10px 0 -22px;filter:drop-shadow(0 8px 10px rgba(40,60,80,.18))}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tabs a{padding:8px 18px;border-radius:11px 11px 0 0;background:var(--silver);color:var(--muted);text-decoration:none;font-weight:700;font-size:14.5px;border:1px solid var(--line);border-bottom:0}
.tabs a.on{background:#fff;color:var(--accent)}
.tabs + .panes{border-top:1px solid var(--line)}

/* ---------- 正文 ---------- */
.doc{margin-top:18px}
.doc .tblw,.doc figure.fig,.doc .callout,.doc .fillflow,.doc pre,.doc .sketch,.doc blockquote{margin:14px 0}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin:18px 0}
.sec>*:last-child{margin-bottom:0}
.sec>h2{font-size:1.24em;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec>h2::before{content:"";flex:none;width:6px;height:1.15em;border-radius:3px;background:var(--accent)}
.doc h3{font-size:1.1em;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.doc h4{font-size:1em;margin:18px 0 8px;color:var(--steel)}
.doc h3 .tk{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#fff;font:800 17px/1 ui-sans-serif,sans-serif;background:var(--teal)}
.doc h3 .tk.B{background:var(--purple)}.doc h3 .tk.C{background:#c47a12}.doc h3 .tk.D{background:#2f7d57}
.doc h3 .tkl{font-size:.8em;color:var(--muted);font-weight:700;margin-right:-4px}
.doc p{margin:12px 0}
.doc ul,.doc ol{margin:12px 0;padding-left:1.5em}
.doc li{margin:5px 0}
.doc li>ul,.doc li>ol{margin:4px 0}
.doc hr{border:0;border-top:1px dashed var(--silver2);margin:22px 0}
.doc blockquote{margin:14px 0;padding:14px 18px;border-radius:12px;background:var(--silver);border-left:5px solid var(--silver2)}
.doc blockquote p{margin:4px 0}
.question{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(120deg,var(--accent-bg),#fff);border:1px solid var(--accent);border-radius:16px;padding:16px 20px;margin:18px 0;font-size:1.08em}
.question .qi{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 22px/1 ui-sans-serif}
.question p{margin:0}
.callout{border-radius:12px;padding:12px 16px;background:var(--amber-bg);border:1px solid var(--amber-line);color:#5a3a06}
.callout p{margin:0}
.callout.info{background:var(--blue-bg);border-color:#a9c4ee;color:#173d7a}
.namebar{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;background:#fff;border:1px dashed var(--silver2);border-radius:12px;padding:10px 16px;margin:16px 0;font-size:.95em}
.lede{color:var(--muted);font-size:.96em}
pre{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font:13.5px/1.6 ui-monospace,Consolas,monospace}

/* 表格 */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.95em}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top}
th:last-child,td:last-child{border-right:0}tr:last-child td{border-bottom:0}
thead th{background:var(--silver);font-weight:700;white-space:nowrap;color:var(--steel)}
tbody tr:nth-child(even) td{background:#fafbfc}
td:first-child{font-weight:600}

/* 填写控件 */
input.blank{font:inherit;color:#0c4f9e;border:0;border-bottom:1.6px solid var(--steel);background:rgba(31,95,196,.045);padding:1px 6px;margin:0 3px;border-radius:4px 4px 0 0;min-width:3.5em;max-width:100%;height:1.75em;vertical-align:baseline}
input.blank:focus,textarea.cell:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
input.blank.long{display:block;width:100%;margin:6px 0 0}
label.ck{display:inline-flex;align-items:center;gap:6px;margin:1px 12px 1px 0;padding:2px 10px 2px 6px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1.5;white-space:nowrap}
label.ck:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
label.ck.solo{border:0;background:none;padding:0;margin:0}
label.ck input{width:1.15em;height:1.15em;accent-color:var(--accent);margin:0}
textarea.cell{font:inherit;color:#0c4f9e;width:100%;min-height:2.6em;border:0;background:rgba(31,95,196,.045);border-radius:6px;padding:4px 8px;resize:vertical;display:block}
.sketch{position:relative;border:1.5px dashed var(--silver2);border-radius:10px;background:#fff;min-width:120px}
.sketch canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:10px}
.sketch button{position:absolute;right:4px;top:4px;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 6px;color:var(--muted)}
td>.sketch{min-height:120px;height:120px}
.doc>.sketch,.sec>.sketch{height:240px}

/* 课尾导航与工具 */
.lnav{display:flex;gap:12px;align-items:stretch;margin:26px 0 0}
.lnav a{flex:1;display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-decoration:none;color:var(--ink)}
.lnav a:hover{border-color:var(--accent)}
.lnav a small{display:block;color:var(--muted);font-size:12.5px}
.lnav a.nx{text-align:right}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin:18px 0 0;font-size:13px;color:var(--muted);align-items:center}
.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:4px 12px;font-size:13px}
.tools button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- 首页 ---------- */
.hero{position:relative;isolation:isolate;display:flex;align-items:center;aspect-ratio:1942/809;min-height:340px;background:#f8fcf8;border:1px solid var(--line);border-radius:24px;padding:34px 36px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.85) 38%,rgba(255,255,255,.18) 64%,transparent 76%);pointer-events:none}
.hero>div{position:relative;z-index:2;width:64%}
.hero .hero-backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
.hero h1{font-size:clamp(26px,3.6vw,40px);letter-spacing:-.01em}
.hero .sub{font-size:1.05em;color:var(--steel);margin:12px 0 18px;max-width:30em}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:0}
.hero .acts .tbtn{height:42px;font-size:15px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.hcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.hcard h3{font-size:1.02em;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.hcard p{margin:0;color:var(--muted);font-size:.93em}
.hcard .ic{color:var(--accent)}
.unit{margin:26px 0 0}
.unit>h2{font-size:1.05em;color:var(--steel);display:flex;align-items:center;gap:10px;margin-bottom:10px}
.unit>h2 b{font:800 12px/1 ui-sans-serif;color:#fff;background:var(--steel);border-radius:6px;padding:5px 8px;letter-spacing:.06em}
.lcards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--ink);transition:.15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 18px rgba(40,60,80,.08)}
.lcard .n{grid-row:span 2;font:800 30px/1 "DIN Alternate","Bahnschrift",ui-sans-serif;color:var(--silver2)}
.lcard:hover .n{color:var(--accent)}
.lcard b{font-size:1.02em;line-height:1.4}
.lcard span{color:var(--muted);font-size:.9em;line-height:1.55}
.lcard .links{grid-column:2;display:flex;gap:14px;font-size:.88em;margin-top:4px}

/* ---------- 图解 ---------- */
figure.fig{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;break-inside:avoid}
.fig-h{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(90deg,var(--silver),#f7f9fb);border-bottom:1px solid var(--line)}
.fig-h b{font-size:15.5px;line-height:1.4}
.fig-h .sub{font-size:13px;color:var(--muted);font-weight:400;display:block}
.fig-h .zoom{margin-left:auto;flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;padding:2px 9px;color:var(--muted)}
.fig-h .zoom:hover{color:var(--accent);border-color:var(--accent)}
.fig-b{padding:16px;font-size:14.5px;line-height:1.6;overflow-x:auto}
.fig-b>*:first-child{margin-top:0}.fig-b>*:last-child{margin-bottom:0}
figcaption{padding:10px 16px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted);background:#fbfcfd}
figcaption .kind{display:inline-block;margin-right:8px;font-size:11.5px;font-weight:700;color:var(--steel);background:var(--silver);border-radius:5px;padding:0 7px}
figure.photo .fig-b{padding:0;background:#eef1f5}figure.photo img{display:block;width:100%;max-width:var(--pw,100%);height:auto;margin:0 auto}
.fg{display:grid;gap:12px;margin:12px 0}
.fg2{grid-template-columns:repeat(2,minmax(0,1fr))}.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}.fg4{grid-template-columns:repeat(4,minmax(0,1fr))}.fg5{grid-template-columns:repeat(5,minmax(0,1fr))}.fg6{grid-template-columns:repeat(6,minmax(0,1fr))}
.fc{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.fc>h5{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fc p{margin:0}
.fc .art{display:grid;place-items:center;min-height:96px;margin:4px 0}
.fc .art svg{max-width:100%;height:auto}
.fc small,.dim{color:var(--muted);font-size:12.5px}
.t-teal{--c:var(--teal);--cb:var(--teal-bg)}.t-purple{--c:var(--purple);--cb:var(--purple-bg)}.t-amber{--c:var(--amber);--cb:var(--amber-bg)}
.t-green{--c:var(--green);--cb:var(--green-bg)}.t-blue{--c:var(--blue);--cb:var(--blue-bg)}.t-steel{--c:var(--steel);--cb:var(--silver)}
.fc[class*="t-"]{border-color:color-mix(in srgb,var(--c) 45%,#fff);border-top:4px solid var(--c)}
.fc.soft{background:var(--cb);border-top-width:1px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 11px;font-size:12.5px;font-weight:700;color:#fff;background:var(--c,var(--steel));white-space:nowrap}
.pill.o{color:var(--c);background:var(--cb)}
.num{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c,var(--steel));color:#fff;font:800 13px/1 ui-sans-serif}
.pbtn{display:inline-flex;align-items:center;justify-content:center;border-radius:7px;padding:3px 12px;background:#2466d3;color:#fff;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.pbtn.g{background:#2b8a3e}.pbtn.d{background:#4a5563}.pbtn.p{background:var(--purple)}
.pstat{display:inline-flex;border-radius:6px;padding:2px 10px;background:#22303e;color:#e8f0f8;font-size:12.5px;white-space:nowrap}
.ptab{display:inline-flex;border-radius:7px;padding:3px 12px;border:1.5px solid var(--c,var(--steel));color:var(--c,var(--steel));font-weight:700;font-size:13px;background:#fff}
.arr{flex:none;color:var(--c,var(--steel));font-weight:800;font-size:18px;line-height:1;align-self:center}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow.st{align-items:stretch}.flow.st>.fc{flex:1 1 150px}
.flow.sp{justify-content:space-around}
.flow.tight{gap:4px}.flow.tight>.fc{flex:1 1 112px;padding:10px 11px}.flow.tight>.arr{font-size:14px}
.fnote{margin:12px 0 0;padding:9px 14px;border-radius:10px;background:var(--cb,var(--silver));color:var(--ink);font-size:13.5px;border:1px solid color-mix(in srgb,var(--c,var(--steel)) 30%,#fff)}
.fnote b{color:var(--c,var(--ink))}
.ln{display:inline-block;width:var(--w,7em);border-bottom:1.5px dashed var(--faint);height:1.2em;vertical-align:baseline;margin:0 3px}
.ln.blk{display:block;width:100%;margin:8px 0 0}
.ico{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.xl{width:44px;height:44px;stroke-width:1.5;color:var(--c,var(--steel))}
.who{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--c,var(--steel));text-align:center;line-height:1.3}
.who .av{width:46px;height:46px;border-radius:50%;background:var(--cb,var(--silver));display:grid;place-items:center;border:2px solid var(--c,var(--steel))}
.who .av .ico{width:26px;height:26px}
.say{position:relative;display:inline-block;background:#fff;border:1.5px solid var(--c,var(--amber-line));border-radius:12px;padding:4px 12px;font-weight:700;font-size:13.5px}
.stage{position:relative;display:grid;place-items:end center;border-radius:12px;background:radial-gradient(ellipse at 50% 100%,#cfd7e1 0%,#e6ebf1 45%,#f5f7fa 100%);padding:10px 10px 12px;min-width:0;overflow:hidden}
.stage::after{content:"";position:absolute;left:22%;right:22%;bottom:7px;height:10px;border-radius:50%;background:rgba(30,45,60,.22);filter:blur(5px)}
.stage img.rb{position:relative;z-index:1}
img.rb{display:block;width:auto;height:var(--h,180px);max-width:100%;object-fit:contain}
.screen{display:inline-block;border:5px solid #2a3644;border-radius:12px;background:linear-gradient(#f4f7fa,#dfe6ee);position:relative;padding:6px 20px;margin-bottom:16px}
.screen::after{content:"";position:absolute;left:50%;bottom:-17px;width:64px;height:12px;transform:translateX(-50%);background:linear-gradient(#2a3644 0 6px,transparent 6px),linear-gradient(90deg,transparent 26px,#2a3644 26px 38px,transparent 38px);border-bottom:4px solid #2a3644;border-radius:0 0 3px 3px}
.screen .cap{display:block;text-align:center;font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.grow{flex:1;min-width:0}
.dgm{display:block;width:100%;height:auto;min-width:var(--mw,620px);font-family:var(--font)}
.dgm text{fill:var(--ink)}
.dgm .t{font-size:15px;font-weight:700}.dgm .s{font-size:13px}.dgm .n{font-size:12px;fill:var(--muted)}
.dgm .bx{stroke-width:1.6;rx:10}
.dgm .ar{fill:none;stroke:var(--steel);stroke-width:2.2}
.loopbar{position:relative;margin:2px 8% 0;height:26px;border:2.4px solid var(--c,var(--teal));border-top:0;border-radius:0 0 14px 14px}
.loopbar::before{content:"";position:absolute;left:-7px;top:-4px;border:6px solid transparent;border-bottom:10px solid var(--c,var(--teal));border-top:0}
